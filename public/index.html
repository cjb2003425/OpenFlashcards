<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenFlashcards</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/img/icons/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/apple-touch-icon.png">
  <link rel="mask-icon" href="/img/icons/favicon-32x32.png" color="#1a1a2e">
  <meta name="apple-mobile-web-app-title" content="Flashcards">
  <meta name="application-name" content="OpenFlashcards">
  <meta name="msapplication-TileColor" content="#1a1a2e">
  <meta name="msapplication-TileImage" content="/img/icons/mstile-150x150.png">
  <meta name="msapplication-config" content="none">
  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json">
  <!-- iOS Safari PWA hints -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a1a2e">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <!-- ── LOGIN SCREEN ─────────────────────────────────────── -->
  <div id="loginScreen" class="login-screen hidden">
    <div class="login-card">
      <img class="login-logo" src="/img/OpenFlashcards%20icon.png" alt="OpenFlashcards">
      <h1 class="login-title">OpenFlashcards</h1>
      <p class="login-sub" id="loginSub">Sign in to continue</p>
      <div id="loginError" class="alert alert-danger hidden"></div>
      <div class="field-group">
        <label id="loginUserLabel">Username</label>
        <input type="text" id="loginUsername" autocomplete="username" autocapitalize="none">
      </div>
      <div class="field-group">
        <label id="loginPassLabel">Password</label>
        <input type="password" id="loginPassword" autocomplete="current-password">
      </div>
      <button class="btn btn-primary btn-full" id="loginBtn">Sign in →</button>
    </div>
  </div>

  <!-- ── APP SHELL ────────────────────────────────────────── -->
  <div id="appShell" class="hidden">

    <!-- NAVBAR -->
    <nav class="navbar" id="navbar">
      <a href="#" class="nav-brand" onclick="navigate('home')">
        <img class="nav-logo" src="/img/OpenFlashcards%20icon.png" alt=""><span>OpenFlashcards</span>
        <span class="lang-badge" id="navLangBadge"></span>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Menu"></button>
      <div class="nav-links" id="navLinks">
        <a class="nav-link" data-page="home" href="#" id="navHome">Home</a>
        <a class="nav-link" data-page="vocabulary" href="#" id="navVocab">Vocabulary</a>
        <a class="nav-link" data-page="train" href="#" id="navTrain">Practice</a>
        <a class="nav-link" data-page="add" href="#" id="navAdd">Add</a>
        <a class="nav-link" data-page="notebook" href="#" id="navNotebook">Notebook</a>
        <a class="nav-link" data-page="print" href="#" id="navPrint">打印测验</a>
        <a class="nav-link" data-page="settings" href="#" id="navSettings">Settings</a>
        <a class="nav-link" id="adminLink" data-page="admin" href="#" style="display:none">Admin</a>
        <button class="btn-icon dark-toggle" id="darkToggle" title="Toggle dark mode"></button>
        <button class="btn-icon sync-offline-btn" id="syncOfflineBtn" title="Sync offline data" style="display:none"
          onclick="window._triggerOfflineSync && window._triggerOfflineSync()"></button>
        <button class="btn-icon" id="logoutBtn" title="Logout" style="display:none"></button>
      </div>
    </nav>

    <!-- PAGES -->
    <main id="pageContent" class="page-content"></main>

    <!-- FOOTER -->
    <footer class="app-footer">
      <a href="https://github.com/Liozon/OpenFlashcards" target="_blank" rel="noopener noreferrer">
        OpenFlashcards - <!--version-->v2026.8.1<!--/version--> - Made with love - 🇨🇭 & 🇺🇦
      </a>
    </footer>
  </div>

  <!-- ── MODAL ────────────────────────────────────────────── -->
  <div id="modal" class="modal-backdrop hidden">
    <div class="modal-card" id="modalCard">
      <div class="modal-header">
        <h2 id="modalTitle">Modal</h2>
        <button class="modal-close" id="modalClose" onclick="closeModal()"></button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>

  <script src="/js/world-languages.js"></script>
  <script src="/js/offline-db.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/pages/home.js"></script>
  <script src="/js/pages/vocabulary.js"></script>
  <script src="/js/pages/add.js"></script>
  <script src="/js/pages/train.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/pages/admin.js"></script>
  <script src="/js/pages/notebook.js"></script>
  <script src="/js/pages/print.js"></script>
  <script src="/js/tts.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // Register sw.js — the full offline SW with IDB support
        navigator.serviceWorker.register('/sw.js', { scope: '/' })
          .then(reg => {
            // Check for updates on navigation
            reg.addEventListener('updatefound', () => {
              const newSW = reg.installing;
              newSW && newSW.addEventListener('statechange', () => {
                if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                  newSW.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            });
          })
          .catch(err => console.warn('[SW] Registration failed:', err));

        // Ask the browser to protect offline storage from eviction (critical on iOS Safari,
        // which clears IndexedDB and SW caches after ~7 days of inactivity otherwise).
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persist().then(granted => {
            console.log('[Storage] Persistent storage:', granted ? 'granted' : 'denied');
          });
        }
      });
    }
  </script>
</body>

</html>
